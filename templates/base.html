<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Set up your AI assistant{% endblock %}</title>
  <style>
    :root { --text: #1a1a1a; --muted: #666; --line: #ddd; --accent: #2d5bff; --error: #b42318; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); background: #fafafa; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    h2 { font-size: 18px; margin: 32px 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 24px; }
    label { display: block; font-weight: 600; margin: 16px 0 4px; }
    .hint { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }
    input[type=text], input[type=url], input[type=email], textarea {
      width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; background: #fff;
    }
    textarea { min-height: 80px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    button { margin-top: 28px; padding: 12px 20px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
    button:hover { filter: brightness(0.92); }
    .error { margin: 0 0 16px; padding: 12px 14px; color: var(--error); background: #fef3f2; border: 1px solid #fecdca; border-radius: 8px; }
    .optional { color: var(--muted); font-weight: 400; }
  </style>
</head>
<body>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
