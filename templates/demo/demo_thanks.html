{% extends "base/site.html" %}
{% block title %}Your demo is on its way{% endblock %}
{% block content %}
<section class="hero">
  <span class="pill">Free demo</span>
  <h1>Check your <em>inbox.</em></h1>
  <p class="lead">Your demo link arrives in about 10 minutes.</p>
  <div class="done">
    <strong>Not there yet?</strong>
    <span class="fine">Check your spam folder. The link works for {{ days }} days.</span>
  </div>
  <a class="button ghost" href="{{ url_for('demo_form') }}">Try another site</a>
</section>
{% endblock %}
