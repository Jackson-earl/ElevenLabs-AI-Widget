<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Set up your AI assistant{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% block header %}{% endblock %}
  <main class="{% block main_class %}{% endblock %}">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="flash {{ category }}" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% if refresh %}
  <script>
    // Reload every 5 seconds to show build progress, but stop once someone types, so a
    // refresh never throws away facts they haven't saved yet.
    let edited = false;
    document.addEventListener("input", () => { edited = true; });
    setInterval(() => { if (!edited) location.reload(); }, 5000);
  </script>
  {% endif %}
</body>
</html>
